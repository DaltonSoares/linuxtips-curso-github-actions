name: Resolucao Desafio Um

on:
  workflow_dispatch:
    inputs:
      validaImagemDocker:
        description: 'Validacao da imagem escolhida pelo usuario'
        required: false
        default: 'nginx:latest'
        type: string    

#env:
#  DOCKER_USERNAME: daltonsoares0@gmail.com
#  DOCKER_PASSWORD: Da123lton.,

jobs:
  pipeline-seguranca:
    runs-on: ubuntu-latest
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v4

      - name: login docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}        

      - name: Baixa a imagem do container
        run: | 
          docker pull ${{ github.event.inputs.validaImagemDocker }}

      - name: Leitura da imagem
        run: | 
          IMAGE_NAME=$(echo "${{ github.event.inputs.validaImagemDocker }}" | cut -d ':' -f 1)
          docker images | grep $IMAGE_NAME

      - name: Scan com o Docker Scout
        uses:  docker/scout-action@v1
        with:
          #command: quickview, cves, recommendations
          image: ${{ github.event.inputs.validaImagemDocker }}
          only-severities: critical, high