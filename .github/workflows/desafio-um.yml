name: Desafio Um

on:
  workflow_dispatch:
    inputs:
      IMAGE_NAME:
        description: 'Informe a imagem e tag - exemplo: nginx:latest'
        required: false
        default: 'ngix:latest'
        type: string    
# Com o usuario e senha abaixo nao funcionara o workflow porque no step de login faz 
# referencia a essas variaveis.
env:
  DOCKER_USERNAME: ***
  DOCKER_PASSWORD: ***

jobs:
  valiando-imagem-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: login docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: baixando imagem docker
        run: docker pull ${{ inputs.IMAGE_NAME }}

      - name: listando imagens disponiveis
        run: docker image ls

      - name: Docker Scout
        uses:  docker/scout-action@v1
        with:
          command: quickview, cves, recommendations
          image: ${{ inputs.IMAGE_NAME }}